name: relay
description: Meshtastic Relay - Secure mesh messaging app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # State management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  # WebSocket
  web_socket_channel: ^2.4.0
  # Secure storage
  flutter_secure_storage: ^9.0.0
  # Local database
  sqflite: ^2.3.2
  path_provider: ^2.1.2
  # Crypto
  pinenacl: ^0.5.1
  cryptography: ^2.7.0
  # Utilities
  convert: ^3.1.1
  intl: ^0.19.0
  collection: ^1.18.0
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
